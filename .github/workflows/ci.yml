name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KM_PIPELINE_MANIFEST: ${{ github.workspace }}/pipelines/manual_extraction/pipeline.yaml
      KM_PIPELINE_ROOT: ${{ github.workspace }}/pipelines/manual_extraction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: km validate --manifest pipelines/manual_extraction/pipeline.yaml --project-root pipelines/manual_extraction
      - run: km test --manifest pipelines/manual_extraction/pipeline.yaml --project-root pipelines/manual_extraction
      - run: km definitions-check --manifest pipelines/manual_extraction/pipeline.yaml --project-root pipelines/manual_extraction
      - run: python -m dagster definitions validate -m km_sdk.dagster_defs
